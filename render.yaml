services:
  - type: web
    name: dragonworksai
    runtime: python
    plan: free
    # Installs the backend's Python deps, then builds the React frontend
    # into frontend/dist so the backend can serve it directly (see the
    # StaticFiles mount at the bottom of backend/main.py).
    buildCommand: "pip install --no-cache-dir -r backend/requirements.txt && cd frontend && npm ci --no-audit --no-fund && npm run build"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --no-server-header"
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: NODE_VERSION
        value: "24.14.1"
      - key: PYTHON_VERSION
        value: "3.14.3"
      # ── Script Generator (text only, no image cost) ────────────────
      # Non-secret, so they live here rather than in the dashboard.
      # gpt-5.4-mini is the recommended default: nano-class models are
      # tuned for classification/extraction and their Indonesian reads
      # translated rather than written. At roughly $0.005 per turn a
      # 20-turn scripting session costs about as much as 2-3 medium
      # thumbnails, so the cost pressure that shapes the image-model
      # choices doesn't really apply. Set gpt-5.4 for stronger concepts.
      - key: SCRIPT_PROVIDER
        value: openai
      - key: SCRIPT_TEXT_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_CAPTION_TEXT_MODEL
        value: gpt-6-luna
      # Generous on purpose — the GPT-5 family are reasoning models and
      # reasoning tokens come out of this same budget. Too low and the
      # model can spend the whole allowance thinking and return nothing.
      - key: SCRIPT_MAX_TOKENS
        value: "3000"
      - key: OPENAI_THUMBNAIL_IMAGE_MODEL
        value: gpt-image-2
      - key: OPENAI_USE_RESPONSES_API
        value: "1"
      - key: OPENAI_RESPONSES_MODEL
        value: gpt-6-luna
      - key: OPENAI_TEXT_MODEL
        value: gpt-6-luna
      # Set the actual values in the Render dashboard (Environment tab) —
      # `sync: false` just means "required, but don't store the value in
      # this file / git history".
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Named team accounts — set the JSON in Render, never in this file.
      # AUTH_REQUIRED makes a missing or malformed value fail closed. Generate
      # password_hash values with: python backend/hash_password.py
      # Example: [{"username":"admin","password_hash":"pbkdf2_sha256$...","role":"admin"}]
      - key: APP_USERS
        sync: false
